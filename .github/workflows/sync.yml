name: 同步上游代码

on:
  schedule:
    - cron: '0 2 */5 * *'  # 每5天 UTC 02:00 运行
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取上游仓库
        run: |
          git remote add upstream https://github.com/jely2002/youtube-dl-gui.git || true
          git fetch upstream --tags

      - name: 导出上游代码
        run: |
          rm -rf upstream
          mkdir -p upstream
          git archive upstream/main | tar -x -C upstream/

      - name: 检查是否有更新
        id: check
        run: |
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          echo "upstream_hash=$UPSTREAM_HASH" >> $GITHUB_OUTPUT

          if [ -f "upstream/.sync-info" ]; then
            OLD_HASH=$(grep "^commit=" upstream/.sync-info | cut -d'=' -f2)
            if [ "$UPSTREAM_HASH" = "$OLD_HASH" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "上游代码无变化，跳过同步"
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "检测到上游更新：$OLD_HASH -> $UPSTREAM_HASH"
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "首次同步"
          fi

      - name: 写入同步信息
        if: steps.check.outputs.changed == 'true'
        run: |
          UPSTREAM_HASH=${{ steps.check.outputs.upstream_hash }}
          VERSION=$(grep -m1 '"version"' upstream/package.json | sed 's/.*: *"//;s/".*//' || echo "unknown")
          cat > upstream/.sync-info << EOF
          commit=$UPSTREAM_HASH
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          upstream_url=https://github.com/jely2002/youtube-dl-gui
          version=$VERSION
          EOF
          echo "同步信息已写入：commit=$UPSTREAM_HASH, version=$VERSION"

      - name: 提交并推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upstream/
          git commit -m "chore: 同步上游代码 $(grep '^version=' upstream/.sync-info | cut -d'=' -f2) ($(date -u +%Y-%m-%d))"
          git push

      - name: 创建镜像标签
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION=$(grep "^version=" upstream/.sync-info | cut -d'=' -f2)
          SHORT_HASH=$(echo ${{ steps.check.outputs.upstream_hash }} | cut -c1-7)
          TAG_NAME="mirror-v${VERSION}-${SHORT_HASH}"

          if git tag -l "$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "标签 $TAG_NAME 已存在，跳过"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "已创建镜像标签：$TAG_NAME"
          fi

      - name: 同步上游标签
        if: steps.check.outputs.changed == 'true'
        run: |
          for tag in $(git tag -l | grep -v "^mirror-"); do
            if git ls-remote --tags origin | grep -q "refs/tags/$tag"; then
              echo "标签 $tag 已存在于远程，跳过"
            else
              echo "推送标签：$tag"
              git push origin "$tag" 2>&1 || {
                echo "⚠️ 标签 $tag 推送失败（可能需要 PAT 令牌）"
              }
            fi
          done

      - name: 完成
        if: steps.check.outputs.changed == 'true'
        run: echo "✅ 同步完成"
